plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.app_tinh_tien"
    compileSdk 36   // 👈 Đổi giá trị này thành 36 (hoặc compileSdkVersion 36)

    defaultConfig {
        applicationId "com.example.app_tinh_tien"
        minSdk 21     // (hoặc minSdkVersion flutter.minSdkVersion)
        targetSdk 36  // 👈 Đổi giá trị này thành 36 (hoặc targetSdkVersion 36)
        ...
    }
}

    namespace "com.example.app_tinh_tien"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.app_tinh_tien"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
